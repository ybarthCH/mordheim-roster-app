name: Deploy to GitHub Pages

# Les deux cibles de déploiement sont séparées par branche (voir le commentaire
# en tête de vite.config.ts) :
#   - `dev`  -> GitHub Pages, la version candidate à tester, servie sous
#               /mordheim-roster-app/ (c'est ce que produit `npm run build`) ;
#   - `main` -> Infomaniak (musterheim.app), via deploy-infomaniak.yml, servi à
#               la racine de son domaine avec `npm run build:prod`.
#
# D'où un déclenchement sur push vers `dev` UNIQUEMENT : un push sur `main` ne
# doit rien envoyer ici, ce que corrigeait déjà « Stop GitHub Pages from
# deploying on push to main ». Le déclenchement manuel reste disponible pour
# republier sans nouveau commit.
on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx oxlint

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
