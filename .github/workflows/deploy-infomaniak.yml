name: Deploy to Infomaniak

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: infomaniak-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npx oxlint
      - name: Build (production, root path)
        run: npm run build:prod
      - name: Check dist size against the Infomaniak quota
        # L'hébergement Infomaniak est plafonné à 10 Mo, et rien ne le
        # vérifiait avant l'envoi : le déploiement se contentait d'échouer (ou
        # de remplir le disque) une fois sur place. En septembre 2026, dist
        # occupait 9,75 Mo sur 10 — à 250 Ko de la rupture — sans qu'aucun
        # signal ne l'indique, une seule bannière de bande supplémentaire
        # (~86 Ko) suffisant à faire basculer.
        #
        # Deux seuils : ERREUR au-delà de LIMITE_KO (on refuse d'envoyer un
        # build qui ne tiendra pas), AVERTISSEMENT au-delà de ALERTE_KO (il
        # reste de la place, mais la marge se réduit). Les dix plus gros
        # fichiers sont listés dans tous les cas, pour que l'échec dise
        # directement quoi optimiser.
        run: |
          set -e
          LIMITE_KO=9500
          ALERTE_KO=8500
          TAILLE_KO=$(du -sk dist | cut -f1)
          echo "dist = ${TAILLE_KO} Ko (alerte ${ALERTE_KO} Ko, limite ${LIMITE_KO} Ko)"
          echo ""
          echo "Dix plus gros fichiers :"
          find dist -type f -printf '%s\t%p\n' | sort -rn | head -10 \
            | awk -F'\t' '{printf "  %8.1f Ko  %s\n", $1/1024, $2}'
          echo ""
          if [ "$TAILLE_KO" -gt "$LIMITE_KO" ]; then
            echo "::error::dist fait ${TAILLE_KO} Ko, au-delà de la limite de ${LIMITE_KO} Ko (quota Infomaniak 10 Mo). Déploiement interrompu avant envoi."
            exit 1
          fi
          if [ "$TAILLE_KO" -gt "$ALERTE_KO" ]; then
            echo "::warning::dist fait ${TAILLE_KO} Ko, au-delà du seuil d'alerte de ${ALERTE_KO} Ko. Marge restante faible sur le quota de 10 Mo."
          fi
      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp
      - name: Deploy via lftp (reverse mirror, delete obsolete files first)
        # SamKirkland/FTP-Deploy-Action's dangerous-clean-slate wipe was
        # confirmed to silently no-op (completing in under a second, far
        # too fast for a real recursive FTP delete of dozens of files),
        # so every deploy was stacking a full duplicate copy of dist/ on
        # top of the previous one instead of replacing it — the actual
        # cause of repeated 10 MB Infomaniak quota exhaustion. lftp's
        # mirror does a real diff against the live server and deletes
        # obsolete files before uploading new ones.
        env:
          FTP_HOST: ${{ secrets.INFOMANIAK_FTP_HOST }}
          FTP_USERNAME: ${{ secrets.INFOMANIAK_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.INFOMANIAK_FTP_PASSWORD }}
        run: |
          set -e
          lftp <<EOF
          set ftp:ssl-allow no
          set cmd:fail-exit yes
          open -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_HOST"
          mirror --reverse --delete --delete-first --verbose --exclude-glob ftpquota --exclude-glob .ftpquota dist/ .
          bye
          EOF
